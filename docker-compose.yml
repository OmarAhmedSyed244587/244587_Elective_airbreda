services:
  redis:
    image: redis:7-alpine
    container_name: redis
    networks: [airbreda]

  air-ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: air-ingest
    env_file: .env
    environment:
      REDIS_HOST: redis
      HEALTH_PORT: "8001"
    ports:
      - "8001:8001"
    restart: unless-stopped
    depends_on: [redis]
    networks: [airbreda]

  traffic-ingest:
    build:
      context: .
      dockerfile: Dockerfile.traffic
    container_name: traffic-ingest
    env_file: .env
    environment:
      REDIS_HOST: redis
      HEALTH_PORT: "8002"
    ports:
      - "8002:8002"
    restart: unless-stopped
    depends_on: [redis]
    networks: [airbreda]

networks:
  airbreda: